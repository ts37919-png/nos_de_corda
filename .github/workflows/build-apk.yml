name: Build NosDeCorda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/nosdecorda
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = 'NosDeCorda'
          include ':app'
          GRADLE
          
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          GRADLE
          
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.nosdecorda'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'com.nosdecorda'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          GRADLE
          
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" android:label="Nós de Corda">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          
          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#C96F3B</item>
              </style>
          </resources>
          XML
          
          cat > app/src/main/java/com/nosdecorda/MainActivity.java <<'JAVA'
          package com.nosdecorda;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.TextView;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  TextView t = new TextView(this);
                  t.setText("🪢\nNÓS DE CORDA\n\nAPK criado com sucesso!\n\nLais de Guia\nCabrestante\nDireito\nEm Oito\nEscota\nTensão");
                  t.setTextSize(24);
                  t.setGravity(Gravity.CENTER);
                  t.setTextColor(Color.rgb(16,32,28));
                  t.setPadding(30,30,30,30);
                  setContentView(t);
              }
          }
          JAVA

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NosDeCorda-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
